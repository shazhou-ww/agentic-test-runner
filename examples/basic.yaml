name: "Basic shell commands"
description: "Verify basic shell command outputs"

cwd: /tmp

steps:
  - command: "echo hello world"
    judge:
      type: regex
      expr: "hello world"
    timeout: 5

  - command: "mkdir -p cli-testkit-demo && cd cli-testkit-demo && pwd"
    judge:
      type: regex
      expr: "/tmp/cli-testkit-demo"

  - command: "echo 'content' > test.txt && cat test.txt"
    judge:
      type: regex
      expr: "content"

  - command: "rm -rf /tmp/cli-testkit-demo"
