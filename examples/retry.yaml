# Example: retry / async steps
name: "Retry examples"
description: "Demonstrate retry on transition and judged steps"

setup:
  - "rm -f /tmp/atest-retry-demo"

steps:
  # Transition step with retry — no judge needed
  # Creates marker on first attempt, passes on second
  - command: "test -f /tmp/atest-retry-demo || (touch /tmp/atest-retry-demo; false)"
    retry:
      max: 3
      interval: 1
      backoff: false

  # Regex judge step
  - command: "echo marker exists"
    judge:
      type: regex
      expr: "marker exists"

  # JSONata judge step with retry (would need real service to test RETRY)
  # - command: "curl -s http://localhost:8080/api/status | jq -r '.state'"
  #   judge:
  #     type: jsonata
  #     expr: "$json(stdout) = 'running'"
  #   retry:
  #     max: 5
  #     interval: 10
  #     backoff: true

  # Transition step with retry that exhausts (always fails)
  # Uncomment to test:
  # - command: "false"
  #   retry:
  #     max: 2
  #     interval: 1

teardown:
  - "rm -f /tmp/atest-retry-demo"
