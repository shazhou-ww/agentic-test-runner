# System commands test spec for atest
name: "System commands"
description: "Verify common system commands work correctly"

setup:
  - "rm -rf /tmp/atest-demo"
  - "mkdir -p /tmp/atest-demo"

steps:
  - command: "echo 'hello atest'"
    judge:
      type: regex
      expr: "hello atest"
    timeout: 5

  # Transition step — no judge, auto-judge by exit code
  - command: "cd /tmp/atest-demo"

  - command: "pwd"
    judge:
      type: regex
      expr: "/tmp/atest-demo"

  - command: "printf 'line1\\nline2\\nline3\\n' > file.txt"
    # transition step — exit 0 = pass

  - command: "cat file.txt"
    judge:
      type: jsonata
      expr: "$contains(stdout, 'line1') and $contains(stdout, 'line2') and $contains(stdout, 'line3')"

  - command: "wc -l file.txt | awk '{print $1}'"
    judge:
      type: regex
      expr: "^3$"

  - command: "uname -s"
    judge:
      type: regex
      expr: "^(Linux|Darwin)$"

  - command: "sleep 2 && echo 'done'"
    judge:
      type: regex
      expr: "done"
    timeout: 10

  - command: "false"
    # exit code 1 → FAIL (expected, demonstrates failure handling)

teardown:
  - "rm -rf /tmp/atest-demo"
